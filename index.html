<!DOCTYPE html>
<html lang="en">
<head>
    <title>Happy Birthday</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading screen with interactive curtain -->
    <div class="loader" id="curtain-loader">
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
    </div>

    <!-- Background birthday music -->
    <audio class="song" loop>
        <source src="music.mp3" type="audio/mpeg">
        Your browser isn't invited for super fun audio time.
    </audio>

    <!-- Canvas used for confetti effect -->
    <canvas id="confetti"></canvas>

    <!-- Main birthday content -->
    <div class="main">
        <div class="container pt-5">
            <div class="row">
                <!-- Birthday banner -->
                <div class="col-12 col-xl-6 mx-auto">
                    <img src="img/banner.png" alt="Birthday Banner">
                </div>

                <!-- Birthday person's name -->
                <div class="col-12 text-center">
                    <div id="name" class="area">Hannah</div>
                </div>

                <!-- Typing animation container -->
                <div class="col-12 text-center">
                    <div class="type-wrap">
                        <div id="typed-strings" class="typing">
                            <h2>Happy Birthday Hannah!!</h2>
                        </div>
                        <span id="typed" style="white-space:pre;"></span>
                    </div>
                </div>

                <!-- Birthday cake section -->
                <div class="col-12 col-xl-3 cake">
                    <img src="img/cake.gif" alt="Birthday Cake">
                </div>
            </div>
        </div>

        <!-- Decorative balloon border -->
        <img src="img/Balloon-Border.png" alt="Balloons" class="balloon-border">
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/magic-snowflakes/dist/snowflakes.min.js"></script>
    <script src="js/jquery.js"></script>
    <script src="js/typed.min.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
